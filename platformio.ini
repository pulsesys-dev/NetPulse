; NetPulse - network health logger (based on Internet Connection Monitor 24H)
; Build:  pio run -e cyd        (ESP32-2432S028R 2.8")
;         pio run -e guition_c  (JC4827W543C capacitive)
;         pio run -e guition_r  (JC4827W543R resistive)
; Upload: pio run -e cyd -t upload

[platformio]
src_dir = NetPulse
default_envs = cyd

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps = moononournation/GFX Library for Arduino@1.4.9
; min_spiffs = two 1.9 MB firmware slots (needed for updates over Wi-Fi) + 190 KB for the history
board_build.partitions = min_spiffs.csv

[env:cyd]
board = esp32dev
build_flags = -DBOARD_CYD

[env:guition_c]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 4MB
build_flags = -DBOARD_GUITION_C -DBOARD_HAS_PSRAM
  ; the USB-C port is the S3's native USB -> Serial must use it
  -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:guition_r]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 4MB
build_flags = -DBOARD_GUITION_R -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
